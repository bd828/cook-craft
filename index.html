<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ночной Фудтрак</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://yandex.ru"></script>
</head>
<body>

    <div class="street-scene">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="buildings">
            <div class="bld b1"></div>
            <div class="bld b2"></div>
            <div class="bld b3"></div>
            <div class="bld b4"></div>
            <div class="bld b5"></div>
        </div>
        <div class="street-lamp">
            <div class="lamp-head"></div>
            <div class="lamp-glow"></div>
        </div>
        <div class="sidewalk"></div>
    </div>

    <div class="truck-frame-top"></div>

    <header>
        <div class="stats-group">
            <div class="badge">💰 <span id="coins">0</span></div>
            <div class="badge">⭐ Ур. <span id="level">1</span></div>
        </div>
        <div class="header-btns">
            <button class="icon-btn" id="shop-btn">🛠️ Улучшения</button>
            <button class="icon-btn" id="music-btn">🎵 Выкл</button>
        </div>
    </header>

    <div class="center-sign-wrap">
        <div class="neon-sign" id="neon-sign" title="Нажмите, чтобы изменить название">
            <span id="sign-text">STREET FOOD</span>
            <span class="edit-hint" id="edit-sign-badge">✏️</span>
        </div>
    </div>

    <aside class="side-menu" id="side-menu">
        <div class="side-menu-header">
            <span>📋 Меню</span>
            <span class="hint-tag" id="hint-status">До 10 ур.</span>
        </div>
        <div class="side-recipe-list" id="side-recipe-list"></div>
    </aside>

    <main class="queue-area" id="queue-area"></main>

    <section class="truck-counter">
        <div class="counter-top-edge"></div>
        <div id="status-msg">Соберите заказ первого гостя в очереди!</div>
        <div class="cooking-row">
            <div class="slot" id="slot-0"></div>
            <div class="plus-sign">+</div>
            <div class="slot" id="slot-1"></div>
            <button class="cook-btn" id="serve-btn">Выдать 🛎️</button>
        </div>
        <div class="ingredients-dock" id="ingredients-dock"></div>
    </section>

    <div class="modal-overlay" id="shop-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>🛠️ Прокачка фудтрака</h2>
                <button class="close-btn" id="close-shop-btn">✕</button>
            </div>
            <div class="shop-list" id="shop-list"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
