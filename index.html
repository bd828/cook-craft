<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кафе Шеф-Алхимик</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://yandex.ru"></script>
</head>
<body>

    <header>
        <div class="stats-badge">💰 <span id="coins">0</span></div>
        <div class="header-btns">
            <button class="icon-btn" id="open-menu-btn">📖 Меню</button>
            <button class="icon-btn" id="music-btn">🎵 Выкл</button>
        </div>
    </header>

    <div class="customer-area">
        <div class="customer-wrapper" id="customer-box">
            <div class="order-bubble">
                <div class="order-dish" id="order-emoji">🥞</div>
                <div class="order-name" id="order-name">Блинчики</div>
                <div class="patience-bar-bg">
                    <div class="patience-bar-fill" id="patience-fill"></div>
                </div>
            </div>
            <div class="customer-avatar" id="customer-avatar">🧑</div>
        </div>
    </div>

    <div class="counter-zone">
        <div id="status-msg">Соберите заказ посетителя!</div>
        <div class="cooking-row">
            <div class="slot" id="slot-0"></div>
            <div class="plus-sign">+</div>
            <div class="slot" id="slot-1"></div>
            <button class="cook-btn" id="serve-btn">Подать! 🍽️</button>
        </div>
        <div class="ingredients-dock" id="ingredients-dock"></div>
    </div>

    <div class="modal-overlay" id="menu-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>📖 Книга рецептов</h2>
                <button class="close-btn" id="close-menu-btn">✕</button>
            </div>
            <div class="recipe-list" id="recipe-list"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
