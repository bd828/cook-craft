<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шеф-Алхимик</title>
    <!-- Подключение SDK Яндекс Игр -->
    <script src="https://yandex.ru"></script>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
            /* Красивый теплый градиентный фон */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #f6d365 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #4a2c2a;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.7);
        }

        .music-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ff758c;
            border-radius: 50px;
            padding: 8px 15px;
            font-family: inherit;
            font-weight: 800;
            font-size: 14px;
            color: #4a2c2a;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .music-btn:active {
            transform: scale(0.95);
        }

        /* Зона готовки (котел/стол) */
        .cooking-zone {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(74, 44, 42, 0.15);
            margin-bottom: 20px;
        }

        .slots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .slot {
            width: 75px;
            height: 75px;
            background: #fff5f5;
            border: 3px dashed #ff758c;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .slot.filled {
            border-style: solid;
            background: #fff;
            transform: scale(1.05);
        }

        .cook-btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 35px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.1s;
        }

        .cook-btn:active {
            transform: scale(0.95);
        }

        #message {
            margin-top: 12px;
            font-weight: 800;
            font-size: 16px;
            min-height: 24px;
            color: #d6336c;
        }

        /* Полка с ингредиентами */
        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin: 10px 0;
        }

        .ingredients-grid, .recipes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.15s;
        }

        .item-card:active {
            transform: scale(0.92);
        }

        .item-emoji {
            font-size: 32px;
            display: block;
        }

        .item-name {
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }

        .recipe-locked {
            opacity: 0.4;
            filter: grayscale(100%);
        }
    </style>
</head>
<body>

    <header>
        <h1>🍳 Шеф-Алхимик</h1>
        <button class="music-btn" id="music-toggle">🎵 Музыка: Выкл</button>
    </header>

    <div class="cooking-zone">
        <div>Выберите 2 ингредиента для смешивания:</div>
        <div class="slots">
            <div class="slot" id="slot-0" onclick="removeIngredient(0)"></div>
            <div class="slot" id="slot-1" onclick="removeIngredient(1)"></div>
        </div>
        <button class="cook-btn" onclick="cook()">Приготовить! ✨</button>
        <div id="message">Нажмите на продукты ниже</div>
    </div>

    <div class="section-title">Продукты</div>
    <div class="ingredients-grid" id="ingredients-list"></div>

    <div class="section-title">Книга рецептов (<span id="unlocked-count">0</span>/<span id="total-count">0</span>)</div>
    <div class="recipes-grid" id="recipes-list"></div>

    <script>
        // --- БАЗА ПРОДУКТОВ И РЕЦЕПТОВ ---
        const ingredients = [
            { id: 'flour', name: 'Мука', emoji: '🌾' },
            { id: 'egg', name: 'Яйцо', emoji: '🥚' },
            { id: 'milk', name: 'Молоко', emoji: '🥛' },
            { id: 'cheese', name: 'Сыр', emoji: '🧀' },
            { id: 'tomato', name: 'Томат', emoji: '🍅' },
            { id: 'meat', name: 'Мясо', emoji: '🥩' },
            { id: 'choco', name: 'Шоколад', emoji: '🍫' },
            { id: 'apple', name: 'Яблоко', emoji: '🍎' }
        ];

        const recipes = [
            { items: ['flour', 'egg'], result: 'Блинчики', emoji: '🥞' },
            { items: ['flour', 'milk'], result: 'Хлеб', emoji: '🍞' },
            { items: ['flour', 'cheese'], result: 'Пицца', emoji: '🍕' },
            { items: ['flour', 'apple'], result: 'Пирог', emoji: '🥧' },
            { items: ['flour', 'choco'], result: 'Пончик', emoji: '🍩' },
            { items: ['egg', 'milk'], result: 'Омлет', emoji: '🍳' },
            { items: ['meat', 'cheese'], result: 'Бургер', emoji: '🍔' },
            { items: ['meat', 'tomato'], result: 'Стейк с соусом', emoji: '🥘' },
            { items: ['milk', 'choco'], result: 'Какао', emoji: '☕' },
            { items: ['egg', 'choco'], result: 'Торт', emoji: '🎂' }
        ];

        let selected = [];
        let unlockedRecipes = JSON.parse(localStorage.getItem('chef_unlocked')) || [];

        // --- ИНИЦИАЛИЗАЦИЯ ЯНДЕКС ИГР ---
        if (window.YaGames) {
            YaGames.init().then(ysdk => {
                console.log('Yandex SDK initialized');
                ysdk.features.LoadingAPI?.ready();
            }).catch(console.error);
        }

        // --- ЗВУКОВОЙ ДВИЖОК (Без внешних файлов) ---
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, duration, type = 'sine', vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Легкая фоновая мелодия
        const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let noteIndex = 0;

        document.getElementById('music-toggle').addEventListener('click', function() {
            initAudio();
            if (isMusicPlaying) {
                clearInterval(musicInterval);
                isMusicPlaying = false;
                this.textContent = '🎵 Музыка: Выкл';
            } else {
                isMusicPlaying = true;
                this.textContent = '🎵 Музыка: Вкл';
                musicInterval = setInterval(() => {
                    playTone(melody[noteIndex], 0.4, 'triangle', 0.05);
                    noteIndex = (noteIndex + 1) % melody.length;
                }, 450);
            }
        });

        // --- ЛОГИКА ИГРЫ ---
        function renderIngredients() {
            const container = document.getElementById('ingredients-list');
            container.innerHTML = '';
            ingredients.forEach(ing => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `<span class="item-emoji">${ing.emoji}</span><span class="item-name">${ing.name}</span>`;
                card.onclick = () => addIngredient(ing);
                container.appendChild(card);
            });
        }

        function renderRecipes() {
            const container = document.getElementById('recipes-list');
            container.innerHTML = '';
            document.getElementById('total-count').textContent = recipes.length;
            document.getElementById('unlocked-count').textContent = unlockedRecipes.length;

recipes.forEach((rec, index) => {
const isUnlocked = unlockedRecipes.includes(index);
const card = document.createElement('div');
card.className = item-card ${isUnlocked ? '' : 'recipe-locked'};
card.innerHTML = <span class="item-emoji">${isUnlocked ? rec.emoji : '❓'}</span> <span class="item-name">${isUnlocked ? rec.result : 'Секрет'}</span>;
container.appendChild(card);
});
}
function addIngredient(ing) {
initAudio();
if (selected.length < 2) {
selected.push(ing);
playTone(500, 0.1, 'sine', 0.1);
updateSlots();
}
}
function removeIngredient(index) {
if (selected[index]) {
initAudio();
selected.splice(index, 1);
playTone(300, 0.1, 'sine', 0.1);
updateSlots();
}
}
function updateSlots() {
for (let i = 0; i < 2; i++) {
const slot = document.getElementById(slot-${i});
if (selected[i]) {
slot.textContent = selected[i].emoji;
slot.classList.add('filled');
} else {
slot.textContent = '';
slot.classList.remove('filled');
}
}
}
function cook() {
initAudio();
const msg = document.getElementById('message');
if (selected.length < 2) {
msg.textContent = 'Нужно выбрать 2 продукта!';
playTone(150, 0.2, 'sawtooth', 0.1);
return;
}
const ids = selected.map(item => item.id).sort();
const foundIndex = recipes.findIndex(r => {
const rIds = [...r.items].sort();
return rIds[0] === ids[0] && rIds[1] === ids[1];
});
if (foundIndex !== -1) {
const recipe = recipes[foundIndex];
msg.textContent = Получилось: ${recipe.emoji} ${recipe.result}!;
// Победный аккорд
playTone(523.25, 0.15);
setTimeout(() => playTone(659.25, 0.3), 100);
if (!unlockedRecipes.includes(foundIndex)) {
unlockedRecipes.push(foundIndex);
localStorage.setItem('chef_unlocked', JSON.stringify(unlockedRecipes));
renderRecipes();
}
} else {
msg.textContent = 'Ничего не вышло, попробуйте другое сочетание 🤷‍♂️';
playTone(200, 0.3, 'sawtooth', 0.1);
}
selected = [];
updateSlots();
}
renderIngredients();
renderRecipes();
</script>

</body>
</html>
